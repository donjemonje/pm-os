# Overrides for the App Hosting backend whose environment name is "eu"
# (Firebase console → App Hosting → backend → Settings → Environment name).
# Merged over apphosting.yaml by variable name; everything else is inherited.
# Lets the EU backend (europe-west4) run against the EU database while the
# US backend keeps serving app.pm-os.io until cutover.
env:
  - variable: INSTANCE_CONNECTION_NAME
    value: pm-os-9d992:europe-west4:pmos-db-eu
    availability:
      - RUNTIME

  - variable: VERTEX_LOCATION
    value: eu
    availability:
      - RUNTIME

  # --- Competitors scanner (EU) ---
  # The EU backend inherits COMPETITORS_RUNNER=cloudrun and COMPETITORS_JOB from apphosting.yaml — the US job,
  # which writes to the US database. Before Competitors is enabled for any EU organization, an EU scanner job
  # (europe-west4, same image, the EU database) is created and named here; until then the feature stays off.
  # - variable: COMPETITORS_JOB
  #   value: "projects/pm-os-9d992/locations/europe-west4/jobs/pmos-competitors-scanner"
  #   availability:
  #     - RUNTIME
