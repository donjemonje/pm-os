# Firebase App Hosting configuration (PROD).
# https://firebase.google.com/docs/app-hosting/configure
#
# Local dev uses dev-apphosting.yaml with the same variable names/order.
# Compare: npm run env:diff

runConfig:
  # One instance stays on: no cold start after idle (Daniel 2026-11-12). Costs one always-on instance.
  minInstances: 1

env:
  # --- Auth gates ---

  # Google sign-in is live (env-only switch; no admin flag). Sign-up is
  # invite-only (PM-OS Admin → Users), so there is no ALLOW_SIGNUP anymore.

  - variable: IDEAS_ENABLED
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  # Surfaces are OFF by default (2026-09-03) and opted in per organization in
  # PM-OS Admin → Enablements. Set one to "true" only to force it on globally.
  - variable: DOCS_ENABLED
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  - variable: CHAT_ENABLED
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  - variable: DASHBOARD_ENABLED
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  - variable: COMPETITORS_ENABLED
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  # --- Competitors scanner ---
  # Website scans run in a Cloud Run job (scanner/Dockerfile: Node + Chromium),
  # triggered by "Scan now" through the Cloud Run API and by Cloud Scheduler
  # hourly with --due. Local dev leaves COMPETITORS_RUNNER unset (= inline).
  - variable: COMPETITORS_RUNNER
    value: "cloudrun"
    availability:
      - RUNTIME
  - variable: COMPETITORS_JOB
    value: "projects/pm-os-9d992/locations/us-east4/jobs/pmos-competitors-scanner"
    availability:
      - RUNTIME
  # PMOS AI models for competitors (Gemini — covered by the GCP credits): a model
  # per role, with the defaults in code (src/lib/competitors/models.ts):
  #   read  = gemini-4-hydrogen (map, research, second look, facts)
  #   match = gemini-4-argon    (merge, unify batches, match)
  #   judge = gemini-4-carbon   (unify review, domains)
  # Set one of these only to override a default. A gemini-* id runs on Gemini
  # with a response schema; anything else on Claude. The old single
  # COMPETITORS_MODEL is read by nothing any more.
  # - variable: COMPETITORS_MODEL_READ
  #   value: "gemini-4-hydrogen"
  #   availability:
  #     - RUNTIME
  # - variable: COMPETITORS_MODEL_MATCH
  # - variable: COMPETITORS_MODEL_JUDGE
  # Competitor profile media (UI captures, deep-dive images) referenced by path
  # from CompetitorMedia / CapabilityInsight.media and served by
  # /api/competitors/media. Unset = every capture shows its labelled placeholder.
  # - variable: COMPETITORS_MEDIA_DIR
  #   value: "/mnt/competitors-media"

  - variable: NEXT_PUBLIC_APP_URL
    value: "https://app.pm-os.io"
    availability:
      - BUILD
      - RUNTIME

  - variable: SESSION_SECRET
    secret: pmos-session-secret
    availability:
      - RUNTIME

  # AES-256-GCM key for TOTP secrets (2FA) — 64 hex chars, Secret Manager only.
  - variable: TOTP_ENC_KEY
    secret: pmos-totp-enc-key
    availability:
      - RUNTIME

  # --- Email (invites, password reset) — Google Workspace SMTP ---
  # support@pm-os.io is its own Workspace user (own profile photo, own app
  # password in SMTP_PASSWORD). SPF + DKIM + DMARC for pm-os.io are set
  # (2026-09-03). Both SMTP_USER and SMTP_PASSWORD unset = emails print to
  # the server log.
  - variable: SMTP_HOST
    value: smtp.gmail.com
    availability:
      - RUNTIME

  - variable: SMTP_PORT
    value: "465"
    availability:
      - RUNTIME

  - variable: SMTP_USER
    value: support@pm-os.io
    availability:
      - RUNTIME

  - variable: SMTP_PASSWORD
    secret: pmos-smtp-password
    availability:
      - RUNTIME

  - variable: SMTP_FROM
    value: "PM-OS <support@pm-os.io>"
    availability:
      - RUNTIME

  - variable: SMTP_REPLY_TO
    value: support@pm-os.io
    availability:
      - RUNTIME

  # --- AI (Vertex default in prod; ADC — no key file) ---
  - variable: AI_PROVIDER
    value: vertex
    availability:
      - RUNTIME

  - variable: VERTEX_PROJECT_ID
    value: pm-os-9d992
    availability:
      - RUNTIME

  - variable: VERTEX_LOCATION
    value: eu
    availability:
      - RUNTIME

  - variable: VERTEX_MODEL
    value: claude-opus-4-8@default
    availability:
      - RUNTIME

  # Dev only: path to a service-account key. Prod uses App Hosting runtime ADC.
  # --- Database ---
  # Dev uses DATABASE_URL (local Postgres). Prod uses Cloud SQL connector vars below.
  - variable: INSTANCE_CONNECTION_NAME
    value: pm-os-9d992:us-east4:pmos-db
    availability:
      - RUNTIME

  - variable: DB_USER
    value: pmos_app
    availability:
      - RUNTIME

  - variable: DB_NAME
    value: pmos
    availability:
      - RUNTIME

  - variable: DB_PASSWORD
    secret: pmos-db-password
    availability:
      - RUNTIME

  # --- OAuth (Sign in + integrations) ---
  - variable: GOOGLE_CLIENT_ID
    secret: pmos-google-client-id
    availability:
      - RUNTIME

  - variable: GOOGLE_CLIENT_SECRET
    secret: pmos-google-client-secret
    availability:
      - RUNTIME

  - variable: ATLASSIAN_CLIENT_ID
    secret: pmos-atlassian-client-id
    availability:
      - RUNTIME

  - variable: ATLASSIAN_CLIENT_SECRET
    secret: pmos-atlassian-client-secret
    availability:
      - RUNTIME

  # --- AI tuning ---
  - variable: AI_CACHE_TTL_MS
    value: "600000"
    availability:
      - RUNTIME

  - variable: AI_MAX_RETRIES
    value: "1"
    availability:
      - RUNTIME

  - variable: AI_MIN_REQUEST_GAP_MS
    value: "2500"
    availability:
      - RUNTIME

  - variable: AI_RETRY_BASE_MS
    value: "2000"
    availability:
      - RUNTIME

  - variable: AI_USE_TEMPLATE_ON_QUOTA
    value: "true"
    availability:
      - RUNTIME

