# Test environment (e2e suite). Copy to test-apphosting.yaml (gitignored)
# and adjust DATABASE_URL for your local Postgres user.
#
# Same format as dev-apphosting.yaml; loaded by scripts/with-apphosting-env.mjs
# via the test:* npm scripts. Points at the pmos_test database — NEVER at the
# dev database `pmos` and NEVER at production.

env:
  - variable: DATABASE_URL
    value: postgresql://YOUR_LOCAL_PG_USER@127.0.0.1:5432/pmos_test?schema=public
    availability:
      - RUNTIME

  - variable: SESSION_SECRET
    value: local-e2e-not-a-secret
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    value: "http://localhost:3200"
    availability:
      - BUILD
      - RUNTIME

  # Fake Google OAuth creds so the provider counts as "configured" — the
  # providers listing and the authorize redirect never call Google's servers,
  # so google-sso.spec.ts can observe the env switch end to end.
  - variable: GOOGLE_CLIENT_ID
    value: test-google-client-id
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_CLIENT_SECRET
    value: test-google-client-secret
    availability:
      - BUILD
      - RUNTIME

  - variable: IDEAS_ENABLED
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  # Off when unset (2026-09-03); the suite asserts these surfaces render.
  - variable: DOCS_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  - variable: CHAT_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  - variable: DASHBOARD_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  # --- 2FA (mandatory) ---
  # Fixed synthetic key for encrypting the seeded test TOTP secret. Keep this
  # EXACT value: it must match the CI job env (.github/workflows/e2e.yml) and
  # the seed encrypts with it. Test-only, not a secret.
  - variable: TOTP_ENC_KEY
    value: "5439664bcd0b64e6fc538ce85f793bcf5439664bcd0b64e6fc538ce85f793bcf"
    availability:
      - RUNTIME

  # --- Live Jira for the e2e suite (optional; feature/jira-support-kela) ---
  # The Kela QA org (scripts/seed-test-db.mjs) connects to a TEST project on
  # the demo Atlassian site with an API token (basic auth; OAuth refresh tokens
  # would rotate away on a wiped DB). Unset → the Kela QA org is seeded without
  # a Jira connection and the live-Jira specs skip. Create the TEST project
  # with scripts/jira-test-project.mjs (see its header). Never commit the token.
  # - variable: JIRA_TEST_SITE_URL
  #   value: "https://d3east.atlassian.net"
  # - variable: JIRA_TEST_EMAIL
  #   value: "you@example.com"
  # - variable: JIRA_TEST_API_TOKEN
  #   value: "<api token>"
  # - variable: JIRA_TEST_PROJECT_KEY
  #   value: "TEST"
  # - variable: JIRA_TEST_PRODUCT_LINE_FIELD_ID
  #   value: "customfield_10319"
